kind = "web"
previewPath = "/"
title = "DeepFocus"
version = "1.0.0"
id = "artifacts/deepfocus"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 22065
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/deepfocus run dev"

[services.env]
PORT = "22065"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/deepfocus", "run", "build"]
publicDir = "artifacts/deepfocus/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
